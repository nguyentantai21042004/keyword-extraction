# Vietnamese Aspect Dictionary for Product Reviews
#
# This dictionary maps both Vietnamese and English keywords to semantic aspects.
# Many Vietnamese texts contain English loanwords and technical terms, so this
# dictionary includes bilingual keywords for better coverage.
#
# Format:
#   aspects:
#     ASPECT_NAME:
#       keywords:
#         - keyword1 (Vietnamese)
#         - keyword2 (English)
#
# Note: Keywords are matched case-insensitively

